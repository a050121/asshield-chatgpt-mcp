<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Asshield Insurance Options</title>
  <style>/*__ASSHIELD_THEME__*/</style>
</head>
<body>
  <div class="card" role="region" aria-label="Asshield insurance options">
    <header class="hero">
      <div class="hero-row">
        <img class="hero-logo" src="LOGO_SRC" alt="" width="48" height="48" />
        <div>
          <h1>Asshield Insurance</h1>
          <p class="sub">Choose a line to start a quote request</p>
        </div>
      </div>
      <span class="hero-badge">Insurance options</span>
    </header>
    <div class="body">
      <div id="groups"></div>
      <div id="start-panel" class="callout is-hidden" role="dialog" aria-label="Start quote details">
        <p style="margin:0;font-weight:750" id="picked-label">Start quote</p>
        <p class="muted" id="picked-desc" style="margin:4px 0 0"></p>
        <label for="state">State (2-letter)</label>
        <input id="state" maxlength="2" autocomplete="address-level1" placeholder="KY" aria-required="true" />
        <label for="zip">ZIP</label>
        <input id="zip" inputmode="numeric" maxlength="10" autocomplete="postal-code" placeholder="40505" aria-required="true" />
        <div class="actions">
          <button type="button" class="primary" id="btn-start">Start quote request</button>
          <button type="button" class="secondary" id="btn-cancel">Cancel</button>
          <button type="button" class="secondary" id="btn-explain">What does this cover?</button>
        </div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="note">Quote request only — Asshield does not bind coverage or show prices in chat. Licensed states only.</p>
    </div>
  </div>
  <script>/*__ASSHIELD_ICONS__*/</script>
  <script>
  (function () {
    const LICENSED = ["AL","AR","FL","GA","IN","KY","NC","OH","PA","SC","TN","TX"];
    let picked = null, groups = [];
    function $(id){ return document.getElementById(id); }
    function applyTheme(t){ document.documentElement.classList.remove("theme-dark","theme-light"); if(t==="dark"||t==="light") document.documentElement.classList.add("theme-"+t); }
    function setStatus(m){ $("status").textContent = m || ""; }
    const pending = new Map(); let seq = 1;
    function callTool(name, args) {
      if (window.openai?.callTool) return window.openai.callTool(name, args);
      return new Promise((resolve, reject) => {
        const id = seq++; pending.set(id,{resolve,reject});
        window.parent.postMessage({ jsonrpc:"2.0", id, method:"tools/call", params:{ name, arguments: args||{} } }, "*");
        setTimeout(() => { if(pending.has(id)){ pending.delete(id); reject(new Error("timeout")); } }, 20000);
      });
    }
    function renderGroups() {
      const root = $("groups"); root.innerHTML = "";
      for (const g of groups) {
        const h = document.createElement("h3"); h.textContent = g.label; root.appendChild(h);
        const grid = document.createElement("div"); grid.className = "grid"; grid.setAttribute("role","list");
        for (const line of g.lines) {
          const b = document.createElement("button");
          b.type = "button"; b.className = "tile"; b.setAttribute("role","listitem");
          b.setAttribute("aria-label", line.label + ": " + line.one_liner);
          b.innerHTML = `<span class="tile-icon">${window.asshieldIcon(line.id)}</span><span class="tl">${line.label}</span><span class="td">${line.one_liner}</span>`;
          b.onclick = () => openStart(line);
          grid.appendChild(b);
        }
        root.appendChild(grid);
      }
    }
    function openStart(line) {
      picked = line;
      $("start-panel").classList.remove("is-hidden");
      $("picked-label").textContent = "Start " + line.label + " quote";
      $("picked-desc").textContent = line.one_liner;
      setStatus(""); $("state").focus();
    }
    function ingest(payload) {
      const sc = payload?.structuredContent || payload || {};
      if (sc.groups) { groups = sc.groups; renderGroups(); }
      else if (Array.isArray(sc.lines)) {
        const map = { personal:[], commercial:[], recreational:[] };
        for (const l of sc.lines) (map[l.group]||map.personal).push(l);
        groups = [
          { id:"personal", label:"Personal", lines:map.personal },
          { id:"commercial", label:"Commercial", lines:map.commercial },
          { id:"recreational", label:"Recreational", lines:map.recreational }
        ].filter(g => g.lines.length);
        renderGroups();
      }
    }
    window.addEventListener("message", (event) => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== "2.0") return;
      if (message.id != null && pending.has(message.id)) {
        const p = pending.get(message.id); pending.delete(message.id);
        if (message.error) p.reject(message.error); else p.resolve(message.result); return;
      }
      if (message.method === "ui/notifications/tool-result") ingest(message.params||{});
      const theme = message.params?.theme || message.params?.colorScheme;
      if (theme) applyTheme(theme);
    }, { passive:true });
    function sync(){ try { if (window.openai?.toolOutput) ingest({ structuredContent: window.openai.toolOutput }); if (window.openai?.theme) applyTheme(window.openai.theme); } catch(_){} }
    setInterval(sync, 800); sync();
    $("btn-cancel").onclick = () => { $("start-panel").classList.add("is-hidden"); picked=null; };
    $("btn-start").onclick = async () => {
      if (!picked) return;
      const state = $("state").value.trim().toUpperCase();
      const zip = $("zip").value.trim();
      if (!/^[A-Z]{2}$/.test(state)) return setStatus("Enter a 2-letter state code.");
      if (!/^\d{5}(-\d{4})?$/.test(zip)) return setStatus("Enter a valid 5-digit ZIP.");
      if (!LICENSED.includes(state)) return setStatus("Asshield is not licensed in " + state + ". Licensed: " + LICENSED.join(", "));
      setStatus("Starting " + picked.label + " quote…");
      try { await callTool("start_quote", { product: picked.id, state, zip }); setStatus("Quote started — continue in the quote card."); }
      catch (e) { setStatus("Could not start: " + (e?.message || e)); }
    };
    $("btn-explain").onclick = async () => {
      if (!picked) return;
      setStatus("Loading coverage overview…");
      try { await callTool("explain_coverage", { product: picked.id }); setStatus("Coverage overview requested."); }
      catch (e) { setStatus("Could not load overview: " + (e?.message || e)); }
    };
    const mock = new URLSearchParams(location.search).get("mock");
    if (mock) {
      groups = [
        { id:"personal", label:"Personal", lines:[
          {id:"auto",label:"Auto",one_liner:"Protect your car and liability on the road.",group:"personal"},
          {id:"home",label:"Home",one_liner:"Help protect your house and belongings.",group:"personal"},
          {id:"auto_home",label:"Auto + Home",one_liner:"Bundle auto and home in one request.",group:"personal"},
          {id:"renters",label:"Renters",one_liner:"Cover belongings and liability in a rental.",group:"personal"},
          {id:"motorcycle",label:"Motorcycle",one_liner:"Bike liability and physical damage options.",group:"personal"}
        ]},
        { id:"commercial", label:"Commercial", lines:[
          {id:"commercial_auto",label:"Commercial Auto",one_liner:"Business vehicles and drivers.",group:"commercial"},
          {id:"commercial_gl",label:"Commercial GL",one_liner:"General liability for your operations.",group:"commercial"},
          {id:"workers_comp",label:"Workers' Comp",one_liner:"Employee injury coverage where required.",group:"commercial"},
          {id:"trucking",label:"Trucking",one_liner:"For-hire and fleet trucking intake.",group:"commercial"}
        ]},
        { id:"recreational", label:"Recreational", lines:[
          {id:"boat",label:"Boat",one_liner:"Watercraft liability and hull options.",group:"recreational"},
          {id:"golf_cart",label:"Golf Cart",one_liner:"Cart liability and physical damage.",group:"recreational"}
        ]}
      ];
      renderGroups();
      if (mock === "start") openStart(groups[0].lines[0]);
    }
  })();
  </script>
</body>
</html>
