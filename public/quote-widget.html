<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Asshield Insurance Quote</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
    .card { max-width: 640px; margin: auto; border: 1px solid #ddd; border-radius: 18px; padding: 22px; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { padding: 14px; border-radius: 12px; border: 1px solid #bbb; background: white; font-weight: 600; cursor: pointer; }
    .primary { width: 100%; margin-top: 16px; }
    .note { font-size: .9rem; opacity: .75; margin-top: 16px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Shop insurance with Asshield</h1>
    <p>What would you like to quote?</p>
    <div class="grid">
      <button>Auto</button>
      <button>Home</button>
      <button>Auto + Home</button>
      <button>Renters</button>
    </div>
    <button class="primary">⚡ Upload my current policy</button>
    <p class="note">
      Quotes are subject to carrier underwriting and verification. Coverage is not effective until confirmed and bound by the carrier or Asshield.
    </p>
  </div>
</body>
</html>
