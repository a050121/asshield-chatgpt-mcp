services:
  - type: web
    name: asshield-chatgpt-mcp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8787"
      # Set in the Render dashboard to the token from the OpenAI plugin portal.
      - key: OPENAI_APPS_CHALLENGE_TOKEN
        sync: false
